[package]
name = "oxidom"
description = "A DOM implemented in Rust, exposed to Node.js through raw Node-API callbacks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
# cdylib: the Node addon. rlib: lets `tests/` (proptest differential tests) and benches link the core.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Versions pinned exactly (docs/architecture.md §11). `dyn-symbols` resolves Node-API symbols at load time,
# which also lets `cargo test` link the crate without a Node host (measured within noise of static linking).
napi = { version = "=3.14.2", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = { version = "=3.6.12", default-features = false }
html5ever = "=0.40.1"
markup5ever = "=0.40.0"
selectors = "=0.41.0"
cssparser = "=0.38.0"
precomputed-hash = "=0.1.1" # selectors SelectorImpl atom hashes
smallvec = { version = "=1.16.3", features = ["union", "const_generics"] }
rustc-hash = "=2.1.3"
compact_str = "=0.9.0"
memchr = "=2.8.3"
libc = "=0.2.190"

[build-dependencies]
napi-build = "=2.6.0"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
default = []
# Bench build: per-native call counters (`counters()` native). Off by default.
counters = []

[lints]
workspace = true
