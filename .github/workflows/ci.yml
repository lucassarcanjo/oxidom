# Runs on every pull request and every push to main, on Linux. `main` requires all three jobs to pass. Locally,
# `npm run check` runs the same checks (after `npm run build` and `scripts/fetch-refs.sh --wpt`; CONTRIBUTING.md §1).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  node:
    name: Addon + JS suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Contract + native suites (jsdom / happy-dom / oxidom)
        run: npm run test:js
      - name: Same suites through the crossing-getter fallback
        run: npm run test:fallback
      - name: React app suite on oxidom
        run: npm run test:e2e

  parity:
    name: jsdom parity suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cache upstream checkouts (jsdom 30.1.3, WPT at jsdom's pin)
        uses: actions/cache@v4
        with:
          path: refs
          key: refs-${{ hashFiles('scripts/fetch-refs.sh') }}
      - run: scripts/fetch-refs.sh --wpt
      - run: npm ci
      - run: npm run build
      - name: Scoreboard matches the committed expectations
        run: node conformance/parity/report.mjs > /dev/null && git diff --exit-code conformance/parity/results/summary.md
      - name: jsdom's test suite on oxidom, against conformance/parity/expectations
        run: npm run test:parity
      - name: Publish the scoreboard
        if: always()
        run: cat conformance/parity/results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload raw results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-raw
          path: conformance/parity/results/raw/
