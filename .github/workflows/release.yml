# Builds the addon for every supported platform and publishes `nativedom`, `vitest-environment-nativedom` and `jest-environment-nativedom` to npm.
# All binaries ship inside `nativedom` (native/rsdom.<triple>.node); lib/native.cjs picks the one for the host.
#
# Runs on a `v*` tag that matches the package versions, or by hand (Actions > Release > Run workflow), where
# `dry_run` packs and checks everything without publishing. Safe to rerun: a package whose version is already on
# npm is skipped, so a run that failed halfway finishes the rest.
#
# npm auth: trusted publishing (OIDC, `id-token: write`) once it is configured for each package on npmjs.com,
# otherwise the NPM_TOKEN secret. The repository is private, so npm generates no provenance either way.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check, but do not publish
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc builds link against glibc 2.17 (@napi-rs/cross-toolchain), so they load on any current distro.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross, smoke: node }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          # musl: cargo-zigbuild; a cdylib needs the dynamic C runtime.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: -x, zig: true, smoke: alpine }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: -x, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin, smoke: node }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, smoke: node }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        shell: bash
        env:
          RUSTFLAGS: ${{ contains(matrix.target, 'musl') && '-C target-feature=-crt-static' || '' }}
        run: npm run build --workspace=nativedom -- --target ${{ matrix.target }} ${{ matrix.flags }}
      - name: Smoke test
        if: matrix.smoke == 'node'
        shell: bash
        run: node scripts/release-smoke.cjs packages/rsdom
      - name: Smoke test (Alpine)
        if: matrix.smoke == 'alpine'
        run: docker run --rm -v "$PWD:/w" -w /w node:22-alpine node scripts/release-smoke.cjs packages/rsdom
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: packages/rsdom/native/rsdom.*.node
          if-no-files-found: error
      # build.rs output is the same on every platform; the publish job takes it from one build.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: generated
          path: packages/rsdom/lib/generated/
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11.16.0
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages/rsdom/native
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: generated
          path: packages/rsdom/lib/generated
      - name: Check versions and binaries
        run: |
          v=$(node -p "require('./packages/rsdom/package.json').version")
          for p in vitest-environment-rsdom jest-environment-rsdom; do
            e=$(node -p "require('./packages/$p/package.json').version")
            [ "$v" = "$e" ] || { echo "::error::nativedom is $v but packages/$p is $e"; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $v"; exit 1
          fi
          for t in linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl darwin-arm64 darwin-x64 win32-x64-msvc; do
            [ -f "packages/rsdom/native/rsdom.$t.node" ] || { echo "::error::missing rsdom.$t.node"; exit 1; }
          done
          ls -l packages/rsdom/native
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --workspace=nativedom --workspace=vitest-environment-nativedom --workspace=jest-environment-nativedom --pack-destination "$RUNNER_TEMP/pack"
      - name: Smoke test the packed package
        run: |
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/nativedom-*.tgz
          node "$GITHUB_WORKSPACE/scripts/release-smoke.cjs" nativedom
      - name: Publish
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # nativedom first: both environment packages have it as a peer dependency.
          for f in nativedom vitest-environment-nativedom jest-environment-nativedom; do
            tgz=$(ls "$RUNNER_TEMP"/pack/$f-[0-9]*.tgz)
            v=$(node -p "require('./packages/rsdom/package.json').version")
            if npm view "$f@$v" version > /dev/null 2>&1; then
              echo "$f@$v is already on npm, skipping"
            else
              npm publish "$tgz" --access public
            fi
          done
