[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/lucassarcanjo/oxidom"

# Profiles are workspace-wide (cargo ignores them in member manifests).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"   # keep: catch_unwind at the FFI boundary turns Rust bugs into JS errors
debug = false
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[profile.dev]
panic = "unwind"

[profile.test]
opt-level = 1

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
