# Roadmap items (docs/ROADMAP.md) and the parity-suite tests that measure them. results/summary.md reports each
# item's gap: the subtests jsdom passes in those files and rsdom does not. `tests` are globs over
# "<source>:<test id>" (sources: wpt, tuwpt, legacy, api; ids as in expectations/<source>.yaml). `**` must be a
# whole path segment: `api:api/**`, not `api:**`. A leading `!` excludes. Scopes may overlap; report.mjs warns
# about a glob that matches no test. An item without tests has none in the suite's selection (jsdom may still run
# some in a WPT DIR the selection leaves out, conformance/wpt/select.mjs INCLUDE); its contract tests in
# packages/rsdom/test carry it. Run one item's scope with `npm run test:parity -- --item <id>`.

# ---- Stage 1: close the measured library gaps
- id: traversal
  stage: 1
  title: TreeWalker / NodeIterator / NodeFilter
  tests: ['wpt:dom/traversal/**', 'wpt:dom/nodes/Document-createTreeWalker.html', 'legacy:to-port-to-wpts/node-iterator.js']
- id: shadow-root
  stage: 1
  title: ShadowRoot + attachShadow, without retargeting
  tests:
    - 'wpt:shadow-dom/Element-interface-*.html'
    - 'wpt:shadow-dom/ShadowRoot-interface.html'
    - 'wpt:shadow-dom/attach-shadow-non-html-namespace.html'
    - 'wpt:shadow-dom/shadow-root-clonable.html'
    - 'wpt:shadow-dom/Document-prototype-*.html'
    - 'wpt:shadow-dom/Node-prototype-cloneNode.html'
    - 'wpt:shadow-dom/getElementById-dynamic-*.html'
    - 'wpt:shadow-dom/build-deep-detached-shadow-then-append-text.html'
    - 'wpt:shadow-dom/untriaged/shadow-trees/**'
- id: history
  stage: 1
  title: Session history traversal (back, forward, go, popstate)
  tests: [] # WPT history tests navigate documents; jsdom's own touch it via reconfigure() and iframes only (DESIGN §23)
- id: xhr
  stage: 1
  title: XMLHttpRequest
  tests: ['wpt:xhr/**']
- id: observers
  stage: 1
  title: No-op observers and scrolling APIs (beyond jsdom)
  tests: [] # the scrolling APIs' WPT DIR, css/cssom-view, is outside the selection

# ---- Stage 2: jsdom-compatible entry points
- id: jsdom-api
  stage: 2
  title: JSDOM class and options (jsdom's own API tests, through conformance/parity/mocha/rsdom-jsdom.cjs)
  tests: ['api:api/**']

# ---- Stage 3: breadth parity with jsdom
- id: selection
  stage: 3
  title: Selection backed by real Ranges
  tests: ['wpt:selection/**']
- id: cssom
  stage: 3
  title: CSSOM rule objects (insertRule, cssRules, styleSheets)
  tests: ['wpt:css/cssom/**', 'tuwpt:css/cssom/**']
- id: computed-values
  stage: 3
  title: Computed-value fidelity (rgb() colours, numeric font-weight, resolved em)
  # css/selectors checks matching through computed colours, so its gap is mostly computed values (docs/PARITY.md §2.3)
  tests: ['wpt:css/selectors/**', 'tuwpt:css/selectors/**', 'tuwpt:css/css-*/**', 'legacy:to-port-to-wpts/level2/style.js']
- id: events
  stage: 3
  title: document.createEvent, init*Event and the missing event classes
  tests: ['wpt:dom/events/**', 'wpt:uievents/**', 'tuwpt:uievents/**']
- id: forms
  stage: 3
  title: Forms remainder (stepUp/stepDown, valueAsDate, valueAsNumber, meter, progress)
  tests: ['wpt:html/semantics/forms/**', 'tuwpt:html/semantics/forms/**']
- id: file-api
  stage: 3
  title: FileReader with DOM Blob and File
  tests: ['wpt:FileAPI/**']
- id: storage
  stage: 3
  title: Web Storage named properties
  tests: ['wpt:webstorage/**']
- id: reflection
  stage: 3
  title: Reflected IDL attributes and ARIAMixin
  tests:
    - 'wpt:html/dom/reflection-*'
    - 'tuwpt:html/dom/reflection-*'
    - 'wpt:html/dom/aria-*'
    - 'legacy:to-port-to-wpts/level1/html.js'
    - 'legacy:to-port-to-wpts/level2/html.js'
- id: ranges
  stage: 3
  title: Range comparison and stringification, then Range mutation with live boundaries
  tests: ['wpt:dom/ranges/**', 'tuwpt:dom/ranges/**', 'tuwpt:dom/nodes/Node-removeChild.html']
- id: xml
  stage: 3
  title: XML documents, XMLSerializer and DOMParser for XML types
  tests:
    - 'wpt:domparsing/**'
    - 'tuwpt:domparsing/**'
    - 'wpt:html/syntax/*-xml-fragments/**'
    - 'legacy:to-port-to-wpts/level1/core.js'
    - 'legacy:to-port-to-wpts/level2/core.js'
    - 'legacy:to-port-to-wpts/xml.js'
    - 'legacy:to-port-to-wpts/serialization.js'
- id: xpath
  stage: 3
  title: XPath
  tests: ['wpt:domxpath/**', 'legacy:to-port-to-wpts/level3/xpath.js']
- id: geometry
  stage: 3
  title: DOMRect classes and the remaining Window members
  tests: [] # DOMRect's WPT DIR, css/geometry, is outside the selection
- id: core
  stage: 3
  title: Core DOM and HTML behaviour no other item claims
  tests:
    - 'wpt:dom/**'
    - 'tuwpt:dom/**'
    - 'wpt:html/**'
    - 'tuwpt:html/**'
    - 'wpt:encoding/**'
    - 'legacy:to-port-to-wpts/misc*.js'
    - 'legacy:to-port-to-wpts/parsing.js'
    - 'legacy:to-port-to-wpts/htmlimageelement.js'
    - 'legacy:to-port-to-wpts/namespaces.js' # fails on NamedNodeMap named properties (attributes['xmlns:xlink'])
    - '!*:dom/traversal/**'
    - '!*:dom/ranges/**'
    - '!tuwpt:dom/nodes/Node-removeChild.html'
    - '!*:dom/events/**'
    - '!*:html/dom/reflection-*'
    - '!*:html/dom/aria-*'
    - '!*:html/semantics/forms/**'
    - '!*:html/semantics/scripting-1/the-script-element/**'

# ---- Stage 4: architectural work
- id: shadow-dom
  stage: 4
  title: 'Full Shadow DOM: retargeting, slots, scoped styles'
  tests: ['wpt:shadow-dom/**']
- id: custom-elements
  stage: 4
  title: Custom elements and customElements
  tests: ['wpt:custom-elements/**', 'tuwpt:custom-elements/**']
- id: reclamation
  stage: 4
  title: Node memory reclamation inside an Env
  tests: [] # performance work: bench/, not conformance
- id: surrogates
  stage: 4
  title: WTF-8 or UTF-16 character data (lone surrogates round-trip)
  tests: []
- id: browsing-contexts
  stage: 4
  title: iframes, script execution (runScripts) and resource loading
  tests:
    - 'wpt:html/semantics/scripting-1/the-script-element/**'
    - 'tuwpt:html/semantics/scripting-1/the-script-element/**'
    - 'api:api/options-run-scripts.js'
    - 'legacy:to-port-to-wpts/frame.js'
    - 'legacy:to-port-to-wpts/script.js'
    - 'legacy:to-port-to-wpts/on-error.js'
    - 'legacy:to-port-to-wpts/post-message.js'
    - 'legacy:to-port-to-wpts/jsonp.js'
